<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>단서 공유 교실 · 교사용</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--blue-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding:38px 16px 72px}
.hero{text-align:center;margin-bottom:24px}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:850}
.hero h1{margin:9px 0 0;font-size:36px}
.hero p{color:var(--muted);line-height:1.7}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
.card h2{margin:0 0 14px}
.sub{margin:-4px 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
label{font-size:14px;font-weight:850}
input{width:100%;border:1px solid #d8dee8;border-radius:12px;padding:12px 13px;outline:none}
.primary{width:100%;border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;font-weight:900}
.msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.msg.error{color:var(--red);font-weight:850}
.msg.ok{color:var(--green);font-weight:850}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.status-left{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.status-title{font-weight:900}
.status-desc{font-size:12px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{padding:7px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:850}
.secondary{border:1px solid var(--line);background:#fff;color:#475569;border-radius:10px;padding:8px 10px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock{border:0;border-radius:12px;padding:13px;background:var(--blue-soft);color:var(--blue);font-weight:900}
.open{border:0;border-radius:12px;padding:13px;background:var(--green-soft);color:var(--green);font-weight:900}
.danger{width:100%;border:1px solid #fecaca;background:#fff;color:var(--red);border-radius:12px;padding:12px;font-weight:850}
.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.group-box{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.group-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.group-name{font-weight:900}
.group-count{font-size:12px;color:var(--muted)}
.group-body{padding:12px;display:grid;gap:9px}
.clue{border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;padding:28px;border:1px dashed #cbd5e1;border-radius:14px;background:#f8fafc;color:#94a3b8}
.note{padding:12px 13px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.6;margin-bottom:12px}
@media(max-width:700px){.actions,.group-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="badge">교사용 화면</div>
    <h1>단서 공유 교실 관리</h1>
    <p>교사 계정으로 로그인한 뒤 전체 공개 여부를 바꿀 수 있습니다.</p>
  </header>

  <section id="loginCard" class="card">
    <h2>교사 로그인</h2>
    <p class="sub">Firebase Authentication에 직접 등록한 이메일/비밀번호 계정을 사용합니다.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="primary" type="submit">로그인</button>
      <p id="loginStatus" class="msg"></p>
    </form>
  </section>

  <div id="teacherApp" class="hidden">
    <section class="topbar">
      <div class="status-left">
        <span class="dot" id="modeDot"></span>
        <div>
          <div class="status-title" id="modeTitle">상태 확인 중</div>
          <div class="status-desc" id="modeDesc"></div>
        </div>
      </div>
      <div class="toolbar">
        <span class="chip" id="classChip"></span>
        <button id="logoutBtn" class="secondary">로그아웃</button>
      </div>
    </section>

    <section class="card">
      <h2>공개 설정</h2>
      <p class="sub">모둠 토의가 끝난 뒤 전체 공개를 누르면 모든 학생 화면에 다른 모둠 단서가 나타납니다.</p>
      <div class="actions">
        <button id="lockBtn" class="lock">🔒 다른 모둠 단서 가리기</button>
        <button id="revealBtn" class="open">🔓 모든 모둠 단서 공개</button>
      </div>
      <p id="teacherStatus" class="msg"></p>
    </section>

    <section class="card">
      <h2>현재 올라온 전체 단서</h2>
      <div id="groups" class="group-grid"></div>
      <div id="empty" class="empty">아직 올라온 단서가 없습니다.</div>
    </section>

    <section class="card">
      <h2>현재 반 초기화</h2>
      <div class="note">
        현재 반의 단서와 익명 모둠 등록 정보를 모두 삭제합니다. 다음 수업에서 같은 반 링크를 새로 사용할 때만 실행하세요.
      </div>
      <button id="resetBtn" class="danger">현재 반 데이터 전체 삭제</button>
    </section>
  </div>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, collection, getDocs, onSnapshot,
  serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = (s) => document.querySelector(s);

function getClassInfo() {
  const raw = (new URLSearchParams(location.search).get("class") || "1").trim();
  const match = raw.match(/\d+/);
  const n = match ? Math.max(1, parseInt(match[0], 10)) : 1;
  return {number:String(n), id:`class-${String(n).padStart(2,"0")}`};
}

const CLASS = getClassInfo();
$("#classChip").textContent = `${CLASS.number}반`;
document.title = `${CLASS.number}반 · 단서 공유 교실 · 교사용`;

function esc(value="") {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

let app, auth, db;
let clueUnsub = null;
let settingUnsub = null;

function isTeacherUser(user) {
  return !!user && user.providerData.some(p => p.providerId === "password");
}

function renderGroups(items) {
  if (!items.length) {
    $("#empty").classList.remove("hidden");
    $("#groups").innerHTML = "";
    return;
  }

  $("#empty").classList.add("hidden");

  const groups = new Map();
  items.forEach(item => {
    if (!groups.has(item.groupId)) {
      groups.set(item.groupId, {label:item.groupLabel, items:[]});
    }
    groups.get(item.groupId).items.push(item);
  });

  $("#groups").innerHTML = [...groups.values()]
    .sort((a,b) => a.label.localeCompare(b.label, "ko"))
    .map(g => `
      <section class="group-box">
        <div class="group-head">
          <span class="group-name">${esc(g.label)}</span>
          <span class="group-count">단서 ${g.items.length}개</span>
        </div>
        <div class="group-body">
          ${g.items.map(item => `<div class="clue">${esc(item.clueText)}</div>`).join("")}
        </div>
      </section>
    `).join("");
}

function startSubscriptions() {
  if (clueUnsub) clueUnsub();
  if (settingUnsub) settingUnsub();

  settingUnsub = onSnapshot(
    doc(db, "classes", CLASS.id, "settings", "public"),
    snap => {
      const open = snap.exists() && snap.data().revealAll === true;
      $("#modeTitle").textContent = open ? "현재: 모든 모둠 단서 공개" : "현재: 다른 모둠 단서 잠금";
      $("#modeDesc").textContent = open
        ? "학생 화면에 다른 모둠의 단서까지 보입니다."
        : "학생 화면에는 자기 모둠 단서만 보입니다.";
      $("#modeDot").style.background = open ? "#059669" : "#2563eb";
    }
  );

  clueUnsub = onSnapshot(
    collection(db, "classes", CLASS.id, "clues"),
    snap => {
      renderGroups(snap.docs.map(d => ({id:d.id, ...d.data()})));
    },
    err => {
      $("#teacherStatus").textContent = `전체 단서를 불러오지 못했습니다: ${err.code}`;
      $("#teacherStatus").className = "msg error";
    }
  );
}

function stopSubscriptions() {
  if (clueUnsub) clueUnsub();
  if (settingUnsub) settingUnsub();
  clueUnsub = null;
  settingUnsub = null;
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = $("#loginBtn");
  const status = $("#loginStatus");
  btn.disabled = true;
  status.textContent = "로그인 중...";
  status.className = "msg";

  try {
    await signInWithEmailAndPassword(
      auth,
      $("#email").value.trim(),
      $("#password").value
    );
  } catch (err) {
    status.textContent = `로그인 실패: ${err.code}`;
    status.className = "msg error";
  } finally {
    btn.disabled = false;
  }
});

$("#logoutBtn").addEventListener("click", () => signOut(auth));

async function setReveal(value) {
  const status = $("#teacherStatus");
  status.textContent = "설정을 변경하는 중...";
  status.className = "msg";

  try {
    await setDoc(
      doc(db, "classes", CLASS.id, "settings", "public"),
      {revealAll:value, updatedAt:serverTimestamp()},
      {merge:true}
    );

    status.textContent = value
      ? "모든 모둠 단서를 공개했습니다."
      : "다른 모둠 단서를 다시 가렸습니다.";
    status.className = "msg ok";
  } catch (err) {
    status.textContent = `설정 변경 실패: ${err.code} / ${err.message}`;
    status.className = "msg error";
  }
}

$("#lockBtn").addEventListener("click", () => setReveal(false));
$("#revealBtn").addEventListener("click", () => setReveal(true));

async function deleteCollection(pathParts) {
  const snap = await getDocs(collection(db, ...pathParts));
  const docs = snap.docs;

  for (let i = 0; i < docs.length; i += 400) {
    const batch = writeBatch(db);
    docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}

$("#resetBtn").addEventListener("click", async () => {
  const answer = prompt(`${CLASS.number}반 데이터를 모두 삭제합니다.\n계속하려면 '삭제'라고 입력하세요.`);
  if (answer !== "삭제") return;

  const status = $("#teacherStatus");
  status.textContent = "현재 반 데이터를 삭제하는 중...";
  status.className = "msg";

  try {
    await deleteCollection(["classes", CLASS.id, "clues"]);
    await deleteCollection(["classes", CLASS.id, "members"]);

    await setDoc(
      doc(db, "classes", CLASS.id, "settings", "public"),
      {revealAll:false, updatedAt:serverTimestamp()},
      {merge:true}
    );

    status.textContent = "현재 반을 초기화했습니다.";
    status.className = "msg ok";
  } catch (err) {
    status.textContent = `초기화 실패: ${err.code} / ${err.message}`;
    status.className = "msg error";
  }
});

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);

  onAuthStateChanged(auth, async user => {
    if (user && isTeacherUser(user)) {
      $("#loginCard").classList.add("hidden");
      $("#teacherApp").classList.remove("hidden");
      $("#loginStatus").textContent = "";
      startSubscriptions();
      return;
    }

    stopSubscriptions();
    $("#teacherApp").classList.add("hidden");
    $("#loginCard").classList.remove("hidden");

    // 교사용 페이지에서 익명 로그인 상태가 남아 있으면 제거
    if (user && !isTeacherUser(user)) {
      await signOut(auth);
    }
  });
} catch (err) {
  $("#loginStatus").textContent = `Firebase 설정 오류: ${err.code || "unknown"} / ${err.message || ""}`;
  $("#loginStatus").className = "msg error";
}
</script>
</body>
</html>
